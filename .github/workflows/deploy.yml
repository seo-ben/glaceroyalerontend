name: 🚀 Build & Deploy Frontend to LWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🛠️ Build frontend (Vite)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.glaceroyalpos.net/api' }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL || 'https://glaceroyalpos.net' }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME || 'SmartFlow POS' }}
          VITE_RESTAURANT_ID: ${{ secrets.VITE_RESTAURANT_ID || '1' }}
          VITE_PUSHER_KEY: ${{ secrets.VITE_PUSHER_KEY || 'd1d0d69922e211e12df3' }}
          VITE_PUSHER_CLUSTER: ${{ secrets.VITE_PUSHER_CLUSTER || 'eu' }}
          VITE_PUSHER_SCHEME: ${{ secrets.VITE_PUSHER_SCHEME || 'https' }}
        run: npm run build

      - name: 📂 Sync dist/ to LWS via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            api/**
            fidelite/**
            .well-known/**
            cgi-bin/**
